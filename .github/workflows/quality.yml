name: Quality

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Verify authentication
        run: npm run test:auth

      - name: Verify security contracts
        run: npm run test:security

      - name: Verify edition boundaries
        run: npm run test:edition-config && npm run test:console-edition

      - name: Verify product contracts
        run: npm run test:commercial-site && npm run test:customization && npm run test:lisa

      - name: Build production bundle
        run: npm run build
